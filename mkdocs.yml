site_name: Senior Engineer Interview Handbook
site_description: Interview preparation for senior backend and data-platform engineering roles.
docs_dir: docs

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Preparation:
      - Philosophy: preparation-philosophy.md
      - 14-day roadmap: 14-day-roadmap.md
      - Curriculum: curriculum/index.md
      - Progress (repo): ../PROGRESS.md
  - Core Java:
      - Overview: java/index.md
      - "Module 4 — Collections":
          - java/module-04-collections/index.md
          - "L1 Framework overview": java/module-04-collections/01-collections-framework-overview.md
          - "L2 ArrayList vs LinkedList": java/module-04-collections/02-arraylist-vs-linkedlist.md
          - "L3 Set implementations": java/module-04-collections/03-set-implementations.md
          - "L4 Map and HashMap": java/module-04-collections/04-map-fundamentals-and-hashmap.md
          - "L5 Map implementations": java/module-04-collections/05-hashmap-linkedhashmap-treemap.md
          - "L6 Comparable and Comparator": java/module-04-collections/06-comparable-and-comparator.md
          - "L7 Iterators": java/module-04-collections/07-iterators-and-modification.md
          - "L8 Queue and Deque": java/module-04-collections/08-queue-and-deque.md
          - "L9 PriorityQueue": java/module-04-collections/09-priorityqueue-and-heaps.md
          - "L10 Blocking queues": java/module-04-collections/10-blocking-queues-and-backpressure.md
          - "L11 LinkedHashMap LRU": java/module-04-collections/11-linkedhashmap-lru-cache.md
          - "L12 Concurrent collections": java/module-04-collections/12-concurrent-collections-overview.md
          - "L13 Selecting collections": java/module-04-collections/13-selecting-the-right-collection.md
      - "Module 5 — Generics (planned)": java/module-05-generics/index.md
      - "Module 6 — Streams (planned)": java/module-06-java-8-streams/index.md
  - Concurrency: concurrency/index.md
  - Spring and microservices: spring-microservices/index.md
  - Distributed systems: distributed-systems/index.md
  - Kafka: kafka/index.md
  - Data engineering:
      - data-engineering/index.md
      - Spark cross-reference: data-engineering/spark-cross-reference.md
  - AWS: aws/index.md
  - DSA: dsa/index.md
  - Behavioral: behavioral/index.md
  - Mock interviews:
      - mock-interviews/index.md
      - Session framework: mock-interviews/framework.md
  - Rapid revision: rapid-revision/day-14-plan.md
  - Mistakes and misconceptions: mistakes-and-misconceptions/index.md
  - Reference:
      - Quick reference: 90-reference/interview-quick-reference.md
  - Process: process/adding-lessons.md
