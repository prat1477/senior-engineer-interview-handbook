site_name: Senior Engineer Interview Handbook
site_description: Interview preparation for senior backend and data-platform engineering roles.
site_url: https://prat1477.github.io/senior-engineer-interview-handbook/
repo_url: https://github.com/prat1477/senior-engineer-interview-handbook
docs_dir: docs

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - include-markdown

nav:
